# Dev / demo / staging stack for the India-region Ubuntu VPS.
# Production uses upgraded servers with separated/managed Postgres (see docs).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/00-create-keycloak-db.sql:/docker-entrypoint-initdb.d/00-create-keycloak-db.sql:ro
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Published to the host to allow local debugging outside container
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hms"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password_change_me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_change_me}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  plt:
    build:
      context: .
      dockerfile: services/plt/Dockerfile
    environment:
      ENV: development
      ALLOW_DEV_TOKENS: "true"
      OIDC_ISSUER: http://keycloak:8080/realms/hms
      OIDC_AUDIENCE: hms-web
      OIDC_JWKS_URI: http://keycloak:8080/realms/hms/protocol/openid-connect/certs
      DATABASE_URL: postgresql+asyncpg://hms_app:${APP_DB_PASSWORD:-app_password_change_me}@postgres:5432/hms
      # Admin-only URL, used by seed/tests to provision tenants (INSERT on `tenant`
      # is not granted to hms_app). Never used by request handlers.
      SEED_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres_change_me}@postgres:5432/hms
    volumes:
      - ./services/plt/app:/code/app
      - ./tests:/code/tests
      - ./libs:/libs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    expose:
      - "8000"
    ports:
      - "8000:8000"   # remove in staging/prod; nginx fronts it

  nginx:
    image: nginx:1.27
    volumes:
      - ./infra/nginx/hms.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - plt
    ports:
      - "80:80"
      # - "443:443"   # enable with certs in staging/prod

volumes:
  pgdata:
