[project]
name = "hms-plt"
version = "0.1.0"
description = "HMS platform/tenancy foundation service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",             # app runtime driver (async)
    "psycopg2-binary>=2.9",      # sync driver for Alembic migrations (multi-statement DDL)
    "pydantic>=2.7",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.8",
    "fhir.resources>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
packages = ["app"]

