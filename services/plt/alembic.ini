# Alembic config for the PLT service (SQLAlchemy 2.0 async).
#
# The compose stack bootstraps schema+RLS from infra/postgres/init.sql on first
# container start. After bootstrap, mark that state as applied:
#     alembic -c services/plt/alembic.ini stamp 0001_baseline
# and write additive migrations from 0002 onwards.
#
# Migrations run schema-changing DDL (CREATE, GRANT, POLICY), so the URL points
# at a privileged role — never the runtime hms_app role.

[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden by env var ALEMBIC_DATABASE_URL (see env.py).
sqlalchemy.url = postgresql+asyncpg://postgres:postgres_change_me@postgres:5432/hms

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
