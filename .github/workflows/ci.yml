name: CI

# The isolation test is the gate. A failure here blocks merge — patient-data
# tenant isolation (PLT-002) must be proven on every change.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fail-loud gate (PLT-002): runs with NO database service so it proves the app
  # REFUSES to start without a verified, RLS-enforcing Postgres — the permanent
  # defense against silent degradation to a no-isolation mock session.
  startup-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -e "services/plt[dev]"

      - name: Startup guard refuses without a database
        env:
          PYTHONPATH: libs
        run: pytest -q tests/test_startup_guard.py

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_change_me
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hms"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -e "services/plt[dev]"

      - name: Apply schema + RLS (baseline init + all migrations)
        env:
          PGPASSWORD: postgres_change_me
          # Migrations run privileged DDL (CREATE POLICY, GRANT), so admin URL.
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres_change_me@localhost:5432/hms
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d hms -f infra/postgres/init.sql
          cd services/plt && alembic upgrade head

      - name: Lint
        run: ruff check libs services || true   # non-blocking initially

      - name: Isolation + smoke tests (THE GATE)
        env:
          DATABASE_URL: postgresql+asyncpg://hms_app:app_password_change_me@localhost:5432/hms
          # Admin URL for provisioning tenants in conftest (INSERT on `tenant` is
          # not granted to hms_app — least privilege).
          SEED_DATABASE_URL: postgresql+asyncpg://postgres:postgres_change_me@localhost:5432/hms
          PYTHONPATH: libs
        run: pytest -q tests
