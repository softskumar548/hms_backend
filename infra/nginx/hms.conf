# Reverse proxy for hms.zensynq.com (path-based tenancy — ADR-0003).
# Staging host: staging.hms.zensynq.com. Enable the 443 block with real certs
# in staging/prod and force HTTPS + HSTS (patient data — non-negotiable).

server {
    listen 80;
    server_name hms.zensynq.com staging.hms.zensynq.com localhost;

    # In staging/prod, redirect all HTTP to HTTPS instead of proxying:
    # return 301 https://$host$request_uri;

    # API under /api -> PLT (and later an API gateway). Same-origin avoids CORS.
    location /api/ {
        proxy_pass         http://plt:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check passthrough.
    location = /health {
        proxy_pass http://plt:8000/health;
    }

    # The React app would be served here in a full build.
    location / {
        return 200 "HMS platform — PLT foundation running. API at /api/, docs at /api/docs\n";
        add_header Content-Type text/plain;
    }
}

