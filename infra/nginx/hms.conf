# Reverse proxy for stage.zensynq.com, hms.zensynq.com & staging.hms.zensynq.com (ADR-0003).
# Force HSTS & security headers (India region residency & patient data safety).

server {
    listen 80;
    server_name stage.zensynq.com staging.hms.zensynq.com hms.zensynq.com localhost;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # API under /api -> PLT service. Same-origin avoids CORS.
    location /api/ {
        proxy_pass         http://plt:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Keycloak auth under /auth/, /realms/, and /resources/
    location /auth/ {
        proxy_pass         http://keycloak:8080/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /realms/ {
        proxy_pass         http://keycloak:8080/realms/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /resources/ {
        proxy_pass         http://keycloak:8080/resources/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check passthrough
    location = /health {
        proxy_pass http://plt:8000/health;
    }

    # Frontend web static app
    location / {
        proxy_pass         http://web:80/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name stage.zensynq.com staging.hms.zensynq.com hms.zensynq.com;

    ssl_certificate     /etc/letsencrypt/live/stage.zensynq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.zensynq.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security Headers (HSTS, No-Sniff, Frame Deny)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # API under /api -> PLT service. Same-origin avoids CORS.
    location /api/ {
        proxy_pass         http://plt:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Keycloak auth under /auth/, /realms/, and /resources/
    location /auth/ {
        proxy_pass         http://keycloak:8080/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /realms/ {
        proxy_pass         http://keycloak:8080/realms/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /resources/ {
        proxy_pass         http://keycloak:8080/resources/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check passthrough
    location = /health {
        proxy_pass http://plt:8000/health;
    }

    # Frontend web static app
    location / {
        proxy_pass         http://web:80/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
